# OpenCode Review - Docker Installation Workflow Template
# 
# This workflow uses the Docker image-based installation method.
# No additional files required - just this workflow file!
#
# Installation:
#   Copy this file into .gitea/workflows/ from a checkout you have reviewed.

name: OpenCode Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  opencode-review:
    # Trigger on /oc or /opencode command, or on new/updated PR
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    
    # Use an image built from this repository's Dockerfile, pinned by digest so
    # that a re-pushed tag cannot change what runs with your secrets. Get the
    # digest from `docker buildx imagetools inspect <image>:<tag>` after pushing.
    container:
      image: <registry>/<owner>/opencode-review:<tag>@sha256:<digest>
    
    # There is no checkout step. The diff comes from the Gitea API, and leaving
    # the pull request's files out of the container keeps them from supplying
    # their own review configuration.
    steps:
      - name: Run code review
        env:
          # Gitea/Forgejo configuration
          GITEA_TOKEN: ${{ secrets.OPENCODE_GIT_TOKEN }}
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          
          # Model configuration (provider/model-id format)
          # Examples: deepseek/deepseek-chat, anthropic/claude-sonnet-4-5, openai/gpt-4o
          MODEL: deepseek/deepseek-chat
          
          # Review configuration
          REVIEW_LANGUAGE: auto          # auto | en | zh-CN
          # REVIEW_STYLE: balanced       # concise | balanced | thorough | security
          # FILE_PATTERNS: ""            # Glob patterns to filter files (e.g., "*.ts,*.go,src/**")
          
          # LLM API Keys (configure the one matching your MODEL)
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          
          # LLM Gateway (optional, for LiteLLM, OpenRouter, Together AI, etc.)
          # OPENAI_BASE_URL: ""          # e.g., http://localhost:4000/v1
        run: |
          # The entrypoint handles everything automatically
          /entrypoint.sh review
