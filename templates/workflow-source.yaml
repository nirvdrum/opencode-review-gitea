# OpenCode Review - Source Installation Workflow Template
# 
# This workflow uses the source-based installation method.
# Files required in your repository:
#   - .opencode-review/ (agents, tools, skills)
#   - .gitea/workflows/opencode-review.yaml (this file)
#
# Installation:
#   Copy this file into .gitea/workflows/ from a checkout you have reviewed.

name: OpenCode Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  opencode-review:
    # Trigger on /oc or /opencode command, or on new/updated PR
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    container: catthehacker/ubuntu:act-latest@sha256:c58e2b364da03b0c804c7d660f2ecbedf2f221a382b9baa0b344b0144780ff43
    
    steps:
      - name: Check out the review configuration
        # The configuration comes from the base branch rather than the pull
        # request, so that a pull request cannot change how it is reviewed.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          sparse-checkout: .opencode-review
          persist-credentials: false

      - name: Install Bun and OpenCode
        # Both packages pin their platform binaries to their own version, so exact
        # versions here lock the whole toolchain.
        run: npm install -g bun@1.4.2 opencode-ai@1.18.34

      - name: Install dependencies
        working-directory: .opencode-review
        run: bun install --frozen-lockfile

      - name: Run code review
        env:
          # OpenCode configuration
          OPENCODE_CONFIG_DIR: ${{ github.workspace }}/.opencode-review
          
          # Model configuration (provider/model-id format)
          # Examples: deepseek/deepseek-chat, anthropic/claude-sonnet-4-5, openai/gpt-4o
          MODEL: deepseek/deepseek-chat
          
          # Gitea/Forgejo configuration
          GITEA_TOKEN: ${{ secrets.OPENCODE_GIT_TOKEN }}
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          
          # Review configuration
          REVIEW_LANGUAGE: auto          # auto | en | zh-CN
          # REVIEW_STYLE: balanced       # concise | balanced | thorough | security
          # FILE_PATTERNS: ""            # Glob patterns to filter files (e.g., "*.ts,*.go,src/**")
          
          # LLM API Keys (configure the one matching your MODEL)
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          
          # LLM Gateway (optional, for LiteLLM, OpenRouter, Together AI, etc.)
          # OPENAI_BASE_URL: ""          # e.g., http://localhost:4000/v1
          
          # Logging
          OPENCODE_LOG_LEVEL: info
        run: |
          # Build language instruction
          LANG_INSTRUCTION=""
          case "${REVIEW_LANGUAGE:-auto}" in
            zh-CN|zh) LANG_INSTRUCTION="请使用中文回复。" ;;
            en) LANG_INSTRUCTION="Reply in English." ;;
          esac
          
          # Build file filter instruction
          FILE_INSTRUCTION=""
          if [ -n "$FILE_PATTERNS" ]; then
            FILE_INSTRUCTION="Only review files matching: $FILE_PATTERNS."
          fi
          
          # OpenCode loads project configuration from its working directory, so
          # run it somewhere the pull request does not control.
          cd "$(mktemp -d)"
          opencode run --agent code-review \
            "Review this pull request. \
             Analyze code changes, identify issues, and submit review with inline comments. \
             ${LANG_INSTRUCTION} ${FILE_INSTRUCTION}"
