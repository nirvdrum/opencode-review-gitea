name: OpenCode Review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  opencode-review:
    # Review every new or updated pull request. A comment can also ask for a
    # review, but only on a pull request and only when the whole comment is the
    # command, so that mentioning it in passing, or the reviewer quoting it in
    # its own comments, does not start a run.
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == '/oc' || github.event.comment.body == '/opencode'))
    # Adjust runs-on and container to match your runner configuration
    runs-on: linux
    container: catthehacker/ubuntu:act-latest@sha256:c58e2b364da03b0c804c7d660f2ecbedf2f221a382b9baa0b344b0144780ff43
    steps:
      - name: Check out the review configuration
        # The configuration comes from the base branch rather than the pull
        # request, so that a pull request cannot change how it is reviewed.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          sparse-checkout: .opencode-review
          persist-credentials: false

      - name: Install Bun and OpenCode
        # Both packages pin their platform binaries to their own version, so exact
        # versions here lock the whole toolchain.
        run: npm install -g bun@1.4.2 opencode-ai@1.18.34

      - name: Install dependencies
        working-directory: .opencode-review
        run: bun install --frozen-lockfile

      - name: Run code review
        env:
          # IMPORTANT: Use custom config directory to avoid conflicts with user's .opencode/
          # See: https://opencode.ai/docs/config/#custom-directory
          OPENCODE_CONFIG_DIR: ${{ github.workspace }}/.opencode-review
          # Model configuration - use format: provider/model-id
          # Examples: deepseek/deepseek-chat, anthropic/claude-sonnet-4-5, openai/gpt-4o
          MODEL: deepseek/deepseek-chat
          # Gitea API configuration
          GITEA_TOKEN: ${{ secrets.OPENCODE_GIT_TOKEN }}
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          # LLM Provider API keys (configure at least one)
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Debug (optional)
          OPENCODE_LOG_LEVEL: info
        run: |
          # OpenCode loads project configuration from its working directory, so
          # run it somewhere the pull request does not control.
          cd "$(mktemp -d)"
          opencode run --agent code-review \
            "Please review this pull request. \
             Fetch the diff, analyze the code changes, and submit a detailed review \
             with line-level comments for any issues found."
